<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>Antaliya cafe</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Remove Replit dev banner and badge
      function removeReplitElements() {
        var banner = document.getElementById('replit-dev-banner');
        if (banner) { banner.remove(); document.body.style.paddingTop = '0'; }
        var badge = document.getElementById('replit-badge');
        if (badge) badge.remove();
      }
      removeReplitElements();
      document.addEventListener('DOMContentLoaded', removeReplitElements);
      setTimeout(removeReplitElements, 500);
      setTimeout(removeReplitElements, 1500);
    </script>
  </body>
</html>
